name: Grok browser preference on native Android 14
on:
  push:
    branches: [codex/grok-android14-browser-preference]
permissions:
  contents: read
jobs:
  stock-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release APKs and prepare isolated ARM Android
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          qa="$RUNNER_TEMP/android-agent-links"
          mkdir -p "$qa"/{evidence,grok}
          test "$(uname -m)" = aarch64
          printf '%s\n' "$(uname -m)" "$(uname -r)" > "$qa/evidence/host.txt"
          download() {
            curl -fsSL --proto '=https' --connect-timeout 20 --retry 1 --max-time 140 --max-filesize 150000000 \
              "https://d.apkpure.net/b/APK/$1?version=latest" -o "$qa/$2.apk"
          }
          download ai.x.grok grok & download_pid=$!
          image='docker.io/redroid/redroid@sha256:d9ef29d08c5e7ff6d4771a9894d4df47725d9a733dc251c47bc40782cc86359a'
          timeout 240 docker pull --platform linux/arm64 "$image" > "$qa/evidence/image-pull.txt" 2>&1 &
          image_pid=$!
          sudo apt-get update -qq 2>&1 | tee "$qa/apt-update.log" >/dev/null
          sudo apt-get install -y --no-install-recommends adb apksigner dnsmasq-base 2>&1 | tee "$qa/apt-tools.log" >/dev/null
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          for mod in iptable_filter ip6table_filter iptable_raw ip6table_raw iptable_mangle ip6table_mangle iptable_nat ip6table_nat; do sudo modprobe "$mod"; done
          wait "$download_pid"
          wait "$image_pid"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = arm64
          cd "$qa"
          sha256sum grok.apk | tee evidence/artifact-digests.txt
          case "$(cut -d ' ' -f1 evidence/artifact-digests.txt)" in
            8314bf54209fe632fabc04373882d578e385930ac726cbc45481d20183da4629)
              native_split=config.arm64_v8a.apk
              app_abi=arm64-v8a ;;
            b24373aca5e42a27005f483fdcbe17a6869d20ddc667cd4a149fdec90cbb7d87)
              native_split=config.armeabi_v7a.apk
              app_abi=armeabi-v7a ;;
            *)
              echo '::error::Mirror returned a Grok artifact whose digest is outside the known set.'
              exit 1 ;;
          esac
          printf '%s\n' "$app_abi" | tee evidence/app-abi.txt
          unzip -q grok.apk ai.x.grok.apk "$native_split" config.en.apk config.mdpi.apk -d grok
          curl -fsSL --proto '=https' --max-time 20 https://grok.com/.well-known/assetlinks.json -o evidence/grok-dal.json
          verify_set() {
            local key=$1 pkg=$2 apk fingerprint
            shift 2
            for apk; do
              fingerprint="$(apksigner verify --min-sdk-version 34 --max-sdk-version 34 --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF;exit}')"
              test -n "$fingerprint"
              jq -r --arg app "$pkg" '.[]|select(.target.package_name==$app and (.relation | index("delegate_permission/common.handle_all_urls")))|.target.sha256_cert_fingerprints[]|gsub(":";"")|ascii_downcase' "evidence/$key-dal.json" | grep -Fx "$fingerprint"
              printf '%s %s %s\n' "$pkg" "$apk" "$fingerprint" | tee -a evidence/verified-signers.txt
            done
          }
          verify_set grok ai.x.grok grok/*.apk
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate both exact published v0.1.67 Grok share links
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/android-agent-links"
          curl -fsSL --proto '=https' --max-time 15 --max-filesize 300000 https://registry.npmjs.org/agent-deeplinks/-/agent-deeplinks-0.1.67.tgz -o "$qa/release.tgz"
          checksum=$(openssl dgst -sha512 -binary "$qa/release.tgz" | openssl base64 -A)
          test "$checksum" = 'xz0RoBn5ikOFRMkYW55bUJSfBahkVHbeJF5xOi7lkqRzqoXwBTF7x1hz0qMmtLWId9zMiONyHaJY9GL7MLH0yQ=='
          tar -xzf "$qa/release.tgz" -C "$qa" -- package/package.json package/dist
          node --input-type=module - "$qa" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const qa = process.argv[2];
          const version = JSON.parse(readFileSync(qa + '/package/package.json', 'utf8')).version;
          assert.equal(version, '0.1.67');
          const { getAgentLink } = await import(pathToFileURL(qa + '/package/dist/index.js'));
          const publicShare = 'https://grok.com/share/bGVnYWN5_b5ff0ac4-5283-424e-b722-b42379c923f5';
          const options = { action: 'shared-chat', target: publicShare };
          const native = getAgentLink('grok', 'android', options);
          const browser = getAgentLink('grok', 'web', options);
          assert.equal(native, publicShare);
          assert.equal(browser, publicShare + '?stay_in_browser=true');
          writeFileSync(qa + '/evidence/published-links.json', JSON.stringify({ version, native, browser }, null, 2));
          JS
      - name: Run stock resolver and inspect signed-out windows
        run: bash .github/qa/grok-share-android14.sh "$RUNNER_TEMP/android-agent-links"
      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grok-android14-browser-preference
          path: ${{ runner.temp }}/android-agent-links/evidence/
          if-no-files-found: warn
          retention-days: 14
