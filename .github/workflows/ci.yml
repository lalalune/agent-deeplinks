name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:site
      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Check Cloudflare credentials
        id: auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
              echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; skipping automatic Cloudflare Pages deploy."
            else
              echo "::warning::CLOUDFLARE_ACCOUNT_ID secret is not set; skipping automatic Cloudflare Pages deploy."
            fi
          fi
      - name: Checkout commit metadata
        if: steps.auth.outputs.has_token == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download site artifact
        if: steps.auth.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist
      - name: Deploy site to Cloudflare Pages
        if: steps.auth.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=agent-deeplinks --branch=main
