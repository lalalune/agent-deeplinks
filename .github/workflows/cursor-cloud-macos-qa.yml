name: Stock Cursor Cloud Agent on Apple Silicon
on:
  push:
    branches: [codex/cursor-cloud-macos-071]
permissions:
  contents: read
jobs:
  stock-launch:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and verify current official arm64 Cursor
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          scratch="$RUNNER_TEMP/cursor-cloud-agent"
          output="$scratch/evidence"
          mkdir -p "$output" "$scratch/mount" "$scratch/library" "$HOME/Applications"
          test ! -e "$HOME/Library/Application Support/Cursor"
          { sw_vers; uname -m; } > "$output/system.txt"
          library=https://registry.npmjs.org/agent-deeplinks/-/agent-deeplinks-0.1.71.tgz
          curl -fsSL --proto '=https' --max-time 30 --max-filesize 400000 "$library" -o "$scratch/library.tgz"
          printf '%s  %s\n' 731a8095f6b7db41e21650f15938b50a1aad94f01fe2c00d32f5e78618c96b49 "$scratch/library.tgz" | shasum -a 256 -c | tee "$output/library-check.txt"
          tar -xzf "$scratch/library.tgz" -C "$scratch/library"
          channel=https://api2.cursor.sh/updates/download/golden/darwin-arm64/cursor/latest
          download=https://downloads.cursor.com/production/0d3b96e46ce65af82ed74bc6f14883b33e1a0597/darwin/arm64/Cursor-darwin-arm64.dmg
          test "$(curl -fsSI --proto '=https' --max-time 15 "$channel" | tr -d '\r' | awk 'tolower($1)=="location:" { print $2 }')" = "$download"
          curl -fsSL --proto '=https' --connect-timeout 15 --max-time 160 --max-filesize 330000000 -D "$scratch/download-headers.txt" "$download" -o "$scratch/Cursor.dmg"
          test "$(stat -f %z "$scratch/Cursor.dmg")" = 306099513
          tr -d '\r' < "$scratch/download-headers.txt" | grep -iFx 'etag: "9b433927f241a98151b3c87b349e9d8e-37"'
          { printf '%s\n' "$channel" "$download"; shasum -a 256 "$scratch/Cursor.dmg"; } > "$output/official-download.txt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$scratch/mount" "$scratch/Cursor.dmg"
          trap 'hdiutil detach "$scratch/mount" >/dev/null' EXIT
          app="$HOME/Applications/Cursor.app"
          test ! -e "$app"
          test ! -e /Applications/Cursor.app
          ditto "$scratch/mount/Cursor.app" "$app"
          info="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$info")" = 'com.todesktop.230313mzl4w4u92'
          plutil -extract CFBundleShortVersionString raw "$info" | tee "$output/version.txt"
          exe=$(plutil -extract CFBundleExecutable raw "$info")
          lipo -archs "$app/Contents/MacOS/$exe" | tee "$output/app-architectures.txt" | grep -wq arm64
          codesign --verify --strict --deep "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$output/codesign.txt"
          grep -Fx 'TeamIdentifier=VDXQ22DGB9' "$output/codesign.txt"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee "$output/gatekeeper.txt"
          grep -Fx 'source=Notarized Developer ID' "$output/gatekeeper.txt"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          xcrun swiftc .github/qa/cursor-cloud-macos.swift -o "$scratch/observe"
      - name: Open the exact Cloud Agent link in the signed client
        run: node .github/qa/cursor-cloud-macos.mjs "$RUNNER_TEMP/cursor-cloud-agent" "$HOME/Applications/Cursor.app"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cursor-signed-apple-silicon-cloud-agent
          path: ${{ runner.temp }}/cursor-cloud-agent/evidence/
          if-no-files-found: error
          retention-days: 30
