name: Meta Muse stock Safari Apple Silicon handoff QA

on:
  push:
    branches:
      - codex/muse-safari-arm-v070

permissions:
  contents: read

jobs:
  safari-handoff:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate the exact library route
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/muse-qa-results"
          mkdir -p "$output"
          npm pack --silent agent-deeplinks@0.1.70 --pack-destination "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' e2527dc68e3a1fdf83b186562a912e8512365ea8dfa2d1b0e0fcb66dcbca0e1e agent-deeplinks-0.1.70.tgz | shasum -a 256 -c) | tee "$output/npm-check.txt"
          mkdir "$RUNNER_TEMP/muse-npm"
          tar -xf "$RUNNER_TEMP/agent-deeplinks-0.1.70.tgz" -C "$RUNNER_TEMP/muse-npm"
          sw_vers | tee "$output/system.txt"
          uname -m | tee -a "$output/system.txt"
          test "$(uname -m)" = arm64
      - name: Verify and install the stock Muse app
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/muse-qa-results"
          package="$RUNNER_TEMP/muse-14.1.dmg"
          # Public macOS installer from https://ai.meta.com/muse/download/.
          download='https://scontent-iad3-2.xx.fbcdn.net/v/t39.110568-6/10000000_1132580329697374_5497089802661295332_n.dmg/Muse-14.1.dmg?_nc_cat=100&_nc_gid=A1eMYoOxyF6IPCW7jUBY5A&_nc_ht=scontent-iad3-2.xx&_nc_map=urlgen_bucketless&_nc_oc=AdqvqeAw_XAl_VwTtJLPZEWkiC1aOWZBrTG5mhb34LarDEMwcZNy0pX2FpTcZRM-N1I&_nc_ohc=pqH56ooA5MoQ7kNvwG_cT_H&_nc_sid=116824&_nc_ss=7830f&_nc_zt=14&ccb=1-7&oe=6B0FF287&oh=00_AQV3OIEx2XZvLz7IvT-EIanLzkl9bZRNt2kIU9PLrIBGpw'
          curl --fail --silent --show-error --proto '=https' --max-time 90 --max-filesize 104000000 -o "$package" "$download"
          (cd "$RUNNER_TEMP" && printf '%s  %s\n' af5e2bbc7dda9490bb7ddcf5cbedbb5289281fac9b2f8be0fdb428e56ace6985 muse-14.1.dmg | shasum -a 256 -c) | tee "$output/dmg-check.txt"
          mount="$RUNNER_TEMP/muse-qa-mount"
          mkdir -p "$mount" "$HOME/Applications"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$package"
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          app="$HOME/Applications/Muse.app"
          test ! -e "$app"
          ditto "$mount/Muse.app" "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = com.meta.endo
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = 14.1
          codesign --verify --strict --deep "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$output/signature.txt"
          grep -Fx 'TeamIdentifier=V9WTTPBFK9' "$output/signature.txt"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee "$output/gatekeeper.txt"
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/muse-qa-entitlements.plist"
          python3 - "$RUNNER_TEMP/muse-qa-entitlements.plist" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as source:
              entitlements = plistlib.load(source)
          assert "applinks:agent.meta.ai" in entitlements["com.apple.developer.associated-domains"]
          print("Verified signed applinks entitlement for agent.meta.ai")
          PY
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
      - name: Let macOS approve the signed associated domain
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/muse-qa-results"
          app="$HOME/Applications/Muse.app"
          app_pids() {
            ps -axo pid=,comm= | awk -v exe="$app/Contents/MacOS/Muse" '$2 == exe {print $1}'
          }
          test -z "$(app_pids)"
          /usr/bin/open -g -a "$app"
          for sample in $(seq 0 12); do
            state=$(sudo -n swcutil show 2>/dev/null | awk '
              BEGIN { RS="-+\n" }
              /Service:[[:space:]]+applinks/ &&
              /App ID:[[:space:]]+V9WTTPBFK9[.]com[.]meta[.]endo/ &&
              /Domain:[[:space:]]+agent[.]meta[.]ai([[:space:]]|$)/ { print }
            ' || true)
            printf 'Sample %s at %s\n%s\n' "$sample" "$(date -u +%FT%TZ)" "$state" | tee -a "$output/associated-domain-state.txt"
            if grep -Eq 'Site/Fmwk Approval:[[:space:]]+approved' <<< "$state"; then break; fi
            sleep 10
          done
          grep -Eq 'Site/Fmwk Approval:[[:space:]]+approved' <<< "$state"
          for pid in $(app_pids); do kill "$pid"; done
          for sample in $(seq 1 12); do
            if [[ -z "$(app_pids)" ]]; then break; fi
            sleep 1
          done
          test -z "$(app_pids)"
      - name: Physically click the visible npm link in stock Safari
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/muse-qa-results"
          app="$HOME/Applications/Muse.app"
          # An automatic stock app update may still be finalizing after its initial launch.
          for sample in $(seq 1 12); do
            if codesign --verify --deep --strict "$app"; then break; fi
            echo "Update still pending on sample $sample"
            sleep 4
          done
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$output/muse-at-click-signature.txt"
          grep -Fx 'TeamIdentifier=V9WTTPBFK9' "$output/muse-at-click-signature.txt"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee "$output/muse-at-click-gatekeeper.txt"
          grep -Fx 'source=Notarized Developer ID' "$output/muse-at-click-gatekeeper.txt"
          xcrun swiftc .github/qa/muse-safari-visible.swift -o "$RUNNER_TEMP/muse-safari-probe"
          node .github/qa/muse-safari-visible.mjs "$output" "$RUNNER_TEMP/muse-safari-probe" "$RUNNER_TEMP/muse-npm/package" "$app" new-tab
      - name: Save scoped browser and native handoff evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: muse-stock-safari-arm64-${{ matrix.runner }}
          path: ${{ runner.temp }}/muse-qa-results
          if-no-files-found: error
          retention-days: 14
