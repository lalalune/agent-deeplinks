name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:site
      - run: npm run release:zip
      - name: Attach ZIP and npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/agent-deeplinks.zip artifacts/agent-deeplinks.tgz
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes artifacts/agent-deeplinks.zip artifacts/agent-deeplinks.tgz
          fi
